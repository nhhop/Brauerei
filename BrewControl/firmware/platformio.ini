[common]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -std=gnu++17
  -DBREWCTL_GITHUB_REPO=\"nhhop/Brauerei\"
  ; Embedded MQTT broker (TinyMqtt) fits comfortably on all 3 boards — spike
  ; measured +10 KB flash combined with MqttTransport/PubSubClient, see
  ; PLAN.md. Kept as a capability flag (not assumed) so MqttService can stay
  ; correct if a much smaller board is ever added to this list.
  -DBREWCTL_HAS_EMBEDDED_MQTT_BROKER=1
  ; WebSocketTransport (SensActCtrl) dials out with a blocking TCP connect;
  ; the library default of 5 s would stall loop() that long every reconnect
  ; attempt while the hub is unreachable. 1 s is ample on a LAN.
  -DWEBSOCKETS_TCP_TIMEOUT=1000
build_unflags = -std=gnu++11
extra_scripts =
  pre:version_flags.py
  pre:tinymqtt_patch.py
  pre:esp_webpush_patch.py
lib_deps =
  symlink://../../SensActCtrl
  ; IdsInductionCooker is deliberately NOT listed here. SensActCtrl/library.json
  ; already declares it by git URL + SHA, and PlatformIO honours that entry
  ; unconditionally — with a symlink here as well it fetched a SECOND copy,
  ; compiled both, and put the fetched one first on the link line. The pinned
  ; SHA therefore shipped while edits to the local checkout were silently
  ; discarded. One source only: bump the SHA in library.json to roll the
  ; library forward.
  esp32async/ESPAsyncWebServer@^3.1.0
  esp32async/AsyncTCP@^3.2.0
  ; PIO-registry TinyMqtt (0.9.18) is stale; pin the verified GitHub tag.
  https://github.com/hsaturn/TinyMqtt.git#1.1.3
  ; Archived upstream (read-only since 2026-08-03), pinned to its final commit
  ; rather than the v2.0.0 tag: TLS certificate verification (useTlsCertBundle)
  ; only landed after that tag, and without it the push request has no CA to
  ; validate against. Archived means the SHA is as immutable as a tag. Web Push
  ; is a frozen RFC stack (8291/8292), so "no more commits" costs little here,
  ; and PushService keeps the lib out of the rest of the firmware. See PLAN.md
  ; for the Curier/Arduino-core-3 successor.
  https://github.com/ESPToolKit/esp-webPush.git#32b3eefc88e95ec54efdb7ac0830500f3ea446fb

[env:esp32dev]
; Pinned deliberately. IdsCooker drives PIN_YELLOW through the arduino-esp32
; 2.x RMT HAL (rmtInit/rmtSetTick/rmtWrite); Arduino core 3 ships an
; incompatible API. release.yml installs PlatformIO fresh on every run and
; would silently pull whatever platform is newest, so an unpinned entry means
; a release build can lose the RMT path without anyone noticing - it falls
; back to the bit-bang, which blocks loop() ~139 ms twice a second and
; corrupts pulses under load. The caret still lets 6.x patches through.
; This is a bridge, not a verdict: the move to Arduino core 3 / IDF 5 is the
; next agreed topic (see PLAN.md) and will lift the pin on purpose. The
; IDS_USE_RMT guard makes sure the build survives that jump - it falls back
; to the software timing until the RMT path is ported.
platform = espressif32@^6.10.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
  ${common.build_flags}
  -DBREWCTL_USE_LITTLEFS=1
  ; UI upload overwrites /www in place: the 256 KB data partition cannot hold
  ; the old and the new UI bundle at once. Only needed for that small
  ; partition, not for LittleFS as such -- boards with a larger data
  ; partition leave it out and keep the atomic /www.new swap.
  -DBREWCTL_ASSETS_IN_PLACE=1
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
; No SD reader on this test board. LittleFS lives on the internal-flash data
; partition (grown 128 KB -> 256 KB by trimming 64 KB off each OTA app slot,
; see partitions_4mb_littlefs.csv); the default table's ~1.31 MB app slot was
; already too tight for the TLS pull path, hence the wider layout either way.
; NOTE: first switch to this layout must be flashed once over USB; OTA cannot
; change the partition table. `pio run -t uploadfs` puts the UI on the device
; (see README.md).
board_build.partitions = partitions_4mb_littlefs.csv
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}

[env:lolin_s2_mini]
platform = espressif32@^6.10.0  ; see esp32dev above
board = lolin_s2_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
; S2 has no native exception_decoder support in some PIO versions; keep filters minimal
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBREWCTL_USE_LITTLEFS=1
  -DBREWCTL_ASSETS_IN_PLACE=1  ; same 256 KB partition, see esp32dev
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
; Same as esp32dev: no SD reader, LittleFS on the internal-flash data
; partition. One-time USB flash needed on the partition-table switch.
board_build.partitions = partitions_4mb_littlefs.csv
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}

; LilyGo T-Display-S3-AMOLED-1.75 (round 466x466 AMOLED): ESP32-S3
; dual-core, 16 MB flash, 8 MB OPI PSRAM. The SD slot is on a non-default
; SPI bus; main.cpp picks up these BREWCTL_SD_* macros to drive an
; explicit HSPI instance.
;
; ⚠ Pin choice matters: OPI PSRAM on S3 internally claims GPIO 33–37, so
; SD pins MUST avoid that range. The 1.75 board wires the SD to free pins
; 38/39/40/41 (user-verified from board silkscreen 2026-05-18). An earlier
; attempt with 5/35/36/37 — based on a generic "AMOLED variant" search hit
; that was actually the 1.91 board — caused a TG1 watchdog reset during
; SD.begin because the SPI bus was fighting the PSRAM controller. A later
; attempt with CS=4 (from a search hit citing AMOLED-1.43-1.75) got past
; the crash but the card never answered CMD0 — CS was wrong.
;
; Board: the AMOLED-1.75 has no dedicated PIO board id in espressif32@6.3.2;
; reuse "lilygo-t-display-s3" — same ESP32-S3 chip, same 16 MB flash,
; same qio_opi memory type, same USB-CDC. The LCD-vs-AMOLED difference
; only matters to src/display/, which drives the panel itself.
;
; Display hardware (verified on the device 2026-09-22), driven by
; src/display/ behind BREWCTL_HAS_DISPLAY: round 466x466 AMOLED on a CO5300
; over QSPI — CS 10, SCLK 12,
; D0 11, D1 13, D2 14, D3 15, RST 17, EN 16 — plus a CST9217 touch at I2C
; 0x5A on SDA 7 / SCL 6, sharing that bus with the PCF8563 RTC (0x51) and
; the SY6970 PMU (0x6A). The authoritative source is LilyGo's
; libraries/Mylibrary/pin_config.h, which selects between three builds:
; DO0143FAT01 (1.43", SH8601+FT3168), H0175Y003AM (1.75", CO5300+CST9217,
; this board) and DO0143FMST10 (1.43", CO5300+FT3168). Their README's pin
; table only describes the 1.43 — it is also where the bogus "SD CS = 4"
; above comes from: pin_config.h has SD_CS 38 and a separate
; BATTERY_VOLTAGE_ADC_DATA 4.
;
; ⚠ Wire defaults to SDA 18 / SCL 17 on this variant, and GPIO 17 is the
; panel reset. Any I2C sensor item would clock the panel into reset, so
; BREWCTL_I2C_SDA/SCL below make main.cpp claim the real bus (7/6) first
; thing in setup(); a later Wire.begin() without pins leaves it alone.
[env:lilygo_t_display_s3_amoled]
platform = espressif32@^6.10.0  ; see esp32dev above
board = lilygo-t-display-s3
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DBREWCTL_SD_CS=38
  -DBREWCTL_SD_SCK=41
  -DBREWCTL_SD_MOSI=39
  -DBREWCTL_SD_MISO=40
  ; Demo-only pins routed off defaults to safe free GPIOs (no DS18B20/SSR
  ; attached on this board anyway). 16 collides with PSRAM-adjacent uses
  ; on some S3 boards; pick low-numbered unused pins.
  -DBREWCTL_ONEWIRE_PIN=1
  -DBREWCTL_SSR_PIN=2
  -DBREWCTL_I2C_SDA=7
  -DBREWCTL_I2C_SCL=6
  ; Round display (src/display/). lv_conf.h lives next to the display code,
  ; so only this env sees it.
  -DBREWCTL_HAS_DISPLAY=1
  ; spike/lvgl-metrics: throwaway, must not reach main
  -DBREWCTL_SPIKE_METRICS=1
  -DBREWCTL_DISPLAY_STAGE=3
  -DLV_CONF_INCLUDE_SIMPLE
  -I src/display
build_unflags = ${common.build_unflags}
extra_scripts = ${common.extra_scripts}
lib_deps =
  ${common.lib_deps}
  ; LVGL 8.4 builds fine on this platform's GCC 8.4 / gnu++17; 9.x is a
  ; different API and not needed.
  lvgl/lvgl@~8.4.0
  ; Panel driver: a trimmed copy of LilyGo's Arduino_GFX 1.3.7 fork - no
  ; registry version builds for S3 on Arduino core 2 and knows the CO5300.
  ; See vendor/Arduino_GFX-1.3.7/README.md.
  symlink://vendor/Arduino_GFX-1.3.7
  ; CST9217 touch (I2C 0x5A) - a different register set than the FocalTech
  ; parts LilyGo's README lists, so no hand-rolled driver.
  lewisxhe/SensorLib@0.5.0

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -DUNIT_TEST
  -Isrc
build_unflags = -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
