; PlatformIO project config for the SensActCtrl library.
;
; The project root is the library itself (library.json + src/). This ini
; configures the native unit-test environment and a compile check against
; Arduino Core 2. ESP32 example builds happen via `pio ci`:
;
;   pio ci examples/01_local_twopoint_heater \
;          --lib . --board esp32dev --keep-build-dir \
;          -O "build_flags=-std=gnu++17" -O "build_unflags=-std=gnu++11"
;
; (the library needs C++17, but `pio ci` defaults to gnu++11 - hence the -O
; flags; see README for the full list of examples).

[platformio]

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=gnu++17
  -DUNIT_TEST
  -Isrc
  -Wall
  -Wextra
build_unflags =
  -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; Compile and link check against Arduino Core 2 (ESP-IDF 4.4): the library
; keeps separate code paths for Core 2 and 3 (EspNowTransport.cpp,
; AnalogOutputActuator.cpp) so it stays usable standalone, and BrewControl only
; builds Core 3. The library comes in as a dependency of itself, like for any
; other user - that also resolves library.json. ci/core2/main.cpp is the only
; project source. Pinned exactly: newer platformio/espressif32 releases are not
; guaranteed to stay on Core 2. Build with the global PlatformIO core dir, not
; BrewControl's pioarduino one (.pc3).
[env:esp32dev_core2]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11
build_src_filter = -<*> +<../ci/core2/>
lib_deps =
  symlink://.
